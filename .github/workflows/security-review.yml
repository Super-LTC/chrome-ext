name: Security Review

# Automated security review of every pull request targeting main.
# Runs server-side on GitHub Actions (cannot be bypassed like a local hook),
# posts findings as a PR comment, and is a required status check on main so
# nothing merges without passing this review.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  security-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # required to post the security-review comment
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Verify review credential is configured
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not configured for this repository."
            echo "Run 'claude setup-token', then:"
            echo "  gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo ${{ github.repository }}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so Claude can diff against the base branch

      - name: Run Claude Security Review
        id: claude-security-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
          prompt: |
            Perform a focused SECURITY REVIEW of pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Review ONLY the changes in this PR's diff against the base branch. This is a
            browser extension that runs inside a HIPAA-regulated EHR (PointClickCare) and
            can read every resident record on screen, so weight data-exposure and
            content-script isolation issues heavily. Note this repository is PUBLIC.

            Look for:
            - Anything secret committed to the repo — API keys, tokens, customer
              identifiers, internal hostnames. This repository is public, so treat any
              credential in the diff as Critical.
            - PHI leaving the page: resident names, MRNs ("Client ID"), dates of birth or
              clinical detail sent to analytics, logged to the console, put in a URL or
              query string, or written to extension storage without need
            - Over-broad `manifest.json` permissions or host permissions
            - Unsafe DOM injection: innerHTML with page-derived or server-derived strings,
              missing escaping, injected <script> or eval
            - Message-passing gaps: content script <-> background <-> web page boundaries
              that accept commands from an untrusted page, missing sender/origin checks
            - Auth token handling for the Super LTC backend — storage, scope, refresh,
              anything that would let another extension or page read it
            - Dependency or configuration changes that weaken security posture

            Post your results as a SINGLE PR comment using `gh pr comment`. For each real
            issue include: severity (Critical / High / Medium / Low), file:line, the
            vulnerability, and a concrete remediation. If you find no security issues, post a
            comment stating the automated security review completed with no findings. Do not
            comment on style or non-security concerns.
